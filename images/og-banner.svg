<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Dark Zinc-Indigo Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="glow-indigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 140) rotate(35) scale(520 340)">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 510) rotate(-25) scale(480 320)">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="omni-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="text-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#3F3F46" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.4" />
    </linearGradient>

    <!-- Subtle Architectural Grid -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow-indigo)" />
  <rect width="1200" height="630" fill="url(#glow-cyan)" />

  <!-- Outer Frame -->
  <rect x="32" y="32" width="1136" height="566" rx="28" fill="#09090B" fill-opacity="0.45" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Decorative Geometric Rings (Right Side) -->
  <g opacity="0.22" transform="translate(940, 315)">
    <circle r="190" stroke="url(#omni-grad)" stroke-width="1" stroke-dasharray="6 8" />
    <circle r="135" stroke="#818CF8" stroke-width="1" stroke-opacity="0.5" />
    <path d="M0 -95 L82 -47.5 V47.5 L0 95 L-82 47.5 V-47.5 Z" stroke="url(#omni-grad)" stroke-width="2" />
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(88, 92)">
    <rect width="340" height="38" rx="19" fill="#1E1B4B" fill-opacity="0.85" stroke="#6366F1" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="24" cy="19" r="5" fill="#10B981" />
    <text x="40" y="24" fill="#C7D2FE" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.02em">
      100% Client-Side Privacy • Zero Server Uploads
    </text>
  </g>

  <!-- Geometric OmniTools Logo Mark -->
  <g transform="translate(88, 174)">
    <rect width="92" height="92" rx="22" fill="#0F172A" stroke="url(#omni-grad)" stroke-width="2" />
    <path d="M46 16L71.3 30.8V61.2L46 76L20.7 61.2V30.8L46 16Z" stroke="url(#omni-grad)" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M46 27.5L62.1 36.8V55.2L46 64.5L29.9 55.2V36.8L46 27.5Z" fill="url(#omni-grad)" fill-opacity="0.22" stroke="url(#omni-grad)" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="46" cy="46" r="5.5" fill="#38BDF8" />
  </g>

  <!-- Brand Title & Subtitle -->
  <text x="206" y="218" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.03em">
    OmniTools <tspan fill="url(#text-accent)">2.0</tspan>
  </text>
  <text x="206" y="256" fill="#A1A1AA" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500">
    OmniTools 2.0 — 64 Free Client-Side Productivity Tools
  </text>

  <!-- Hero Statement -->
  <text x="88" y="344" fill="#F4F4F5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    Universal Utilities. Instant Browser Execution.
  </text>
  <text x="88" y="388" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    Convert PDFs, compress images, calculate finances, audit SEO, and format code — zero data leaves your device.
  </text>

  <!-- Category Pills Row -->
  <g transform="translate(88, 444)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">
    <rect x="0" y="0" width="136" height="40" rx="12" fill="#18181B" stroke="#27272A" />
    <text x="68" y="25" text-anchor="middle" fill="#FDA4AF">24 PDF Tools</text>

    <rect x="150" y="0" width="144" height="40" rx="12" fill="#18181B" stroke="#27272A" />
    <text x="222" y="25" text-anchor="middle" fill="#93C5FD">6 Image Editors</text>

    <rect x="308" y="0" width="142" height="40" rx="12" fill="#18181B" stroke="#27272A" />
    <text x="379" y="25" text-anchor="middle" fill="#6EE7B7">6 Calculators</text>

    <rect x="464" y="0" width="132" height="40" rx="12" fill="#18181B" stroke="#27272A" />
    <text x="530" y="25" text-anchor="middle" fill="#FCD34D">7 SEO Tools</text>

    <rect x="610" y="0" width="166" height="40" rx="12" fill="#18181B" stroke="#27272A" />
    <text x="693" y="25" text-anchor="middle" fill="#C4B5FD">18 Dev Utilities</text>

    <rect x="790" y="0" width="168" height="40" rx="12" fill="#18181B" stroke="#27272A" />
    <text x="874" y="25" text-anchor="middle" fill="#67E8F9">3 Finance &amp; Fun</text>
  </g>

  <!-- Bottom Footer Bar -->
  <line x1="88" y1="524" x2="1112" y2="524" stroke="#27272A" stroke-width="1" />
  <text x="88" y="562" fill="#71717A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">
    Zero Ads • Zero Tracking • 100% Free Forever
  </text>
  <text x="1112" y="562" text-anchor="end" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600">
    v2.0 • Static &amp; Private
  </text>
</svg>
