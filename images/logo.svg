<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="omni-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="omni-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="40" height="40" rx="10" fill="#0F172A" />
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="url(#omni-grad)" stroke-opacity="0.3" />
  
  <!-- Geometric Omni Hexagon / Infinity Glyph -->
  <path d="M20 7L31 13.5V26.5L20 33L9 26.5V13.5L20 7Z" stroke="url(#omni-grad)" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M20 12L27 16V24L20 28L13 24V16L20 12Z" fill="url(#omni-grad)" fill-opacity="0.2" stroke="url(#omni-grad)" stroke-width="1.5" />
  <!-- Central Pulse Dot -->
  <circle cx="20" cy="20" r="2.5" fill="#38BDF8" />
</svg>
